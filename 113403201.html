<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圓形屬性計算器 (Circle Properties)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        input, button {
            padding: 8px;
            margin-top: 10px;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>圓形計算器</h2>
        <label for="radiusInput">請輸入半徑 (Radius):</label><br>
        <input type="number" id="radiusInput" placeholder="例如: 5">
        <button onclick="runCalculations()">計算</button>

        <div class="result">
            <p id="outputCircumference"></p>
            <p id="outputArea"></p>
        </div>
    </div>

    <script>
        // 1. 計算圓周長的函式 (依題目拼字使用 calcCircumfrence)
        function calcCircumfrence(radius) {
            const circumference = 2 * Math.PI * radius;
            // 將結果四捨五入到小數點後兩位，讓畫面更簡潔
            const resultText = "The circumference is " + circumference.toFixed(2);
            
            // 輸出到網頁上
            document.getElementById("outputCircumference").innerText = resultText;
            // 輸出到 Console (符合一般程式作業要求)
            console.log(resultText); 
        }

        // 2. 計算圓面積的函式
        function calcArea(radius) {
            const area = Math.PI * radius * radius;
            // 將結果四捨五入到小數點後兩位
            const resultText = "The area is " + area.toFixed(2);
            
            // 輸出到網頁上
            document.getElementById("outputArea").innerText = resultText;
            // 輸出到 Console
            console.log(resultText);
        }

        // 觸發計算的輔助函式
        function runCalculations() {
            const radiusValue = document.getElementById("radiusInput").value;
            const radius = parseFloat(radiusValue);

            if (isNaN(radius) || radius <= 0) {
                alert("請輸入有效的正數半徑！");
                return;
            }

            // 呼叫題目要求的兩個函式並傳入半徑
            calcCircumfrence(radius);
            calcArea(radius);
        }
    </script>

</body>
</html>
